name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire official YB crest
        run: python3 -c "from pathlib import Path; p=Path('index.html'); t=p.read_text(); a='src=\"items.js\"'; b='src=\"items.js\"></script>\\n<script src=\"yb-crest.js\"'; p.write_text(t.replace(a,b,1) if a in t else t)"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
